name: Subdomain request
description: Request a free is-your.app subdomain
title: "Subdomain request"
labels: ["request"]
body:
  - type: markdown
    attributes:
      value: |
        Request one free `*.is-your.app` subdomain. Fill in the form below.

        Available record types: `A`, `AAAA`, `CNAME`, `TXT`.
        Choose `Public: Yes` only if you want it listed in the public directory.
        `Display name` is optional and only used when `Public` is `Yes`.

  - type: input
    id: name
    attributes:
      label: "name"
      description: "The subdomain you want (e.g., myname)"
      placeholder: "myname"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: "Record type"
      description: "What type of DNS record should it be?"
      options:
        - "CNAME"
        - "A"
        - "AAAA"
        - "TXT"
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: "Target"
      description: "Where should it point? (IP, hostname, or TXT value)"
      placeholder: "example.github.io"
    validations:
      required: true

  - type: dropdown
    id: public
    attributes:
      label: "Public"
      description: "Should this subdomain appear in the public directory?"
      options:
        - "No (private)"
        - "Yes (public)"
      default: 0
    validations:
      required: true

  - type: input
    id: displayName
    attributes:
      label: "Display name"
      description: "Public display name (only used if Public is Yes)"
      placeholder: "Anonymous"
